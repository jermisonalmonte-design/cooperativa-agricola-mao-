<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperativa Agrícola de Mao - Pedido</title>
</head>

<body>


    <header>
        <h1>Datos del pedido</h1>
    </header>


    <main>
        <section>
            <h2>Información del cliente</h2>

            <form action="#" method="post">

            
                <p>
                    <label for="nombre">Nombre:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>
                </p>

                
                <p>
                    <label for="telefono">Teléfono:</label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        required>
                </p>

                <p>
                    <label for="direccion">Dirección:</label>
                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        required>
                </p>

                <button type="submit">Enviar pedido</button>

            </form>
        </section>
    </main>


    <footer>
        <p>Cooperativa Agrícola de Mao &copy; 2026</p>
    </footer>

</body>

</html>
